name: Hlášení chyby
about: Nahlaste problém v ATED Core
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Děkujeme za hlášení. Odstraňte nebo anonymizujte citlivé údaje.
  - type: input
    id: version
    attributes:
      label: Verze ATED Core
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Verze Home Assistant
      placeholder: 2026.7.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Popis problému
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevantní logy
      render: text
